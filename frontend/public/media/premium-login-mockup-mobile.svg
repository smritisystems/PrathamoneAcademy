<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title description">
  <title id="title">PrathamOne EduOS premium mobile login mockup</title>
  <desc id="description">A mobile-first branded sign-in mockup with accessible email and password fields and help links.</desc>
  <defs>
    <linearGradient id="brand-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08172a"/>
      <stop offset=".62" stop-color="#102644"/>
      <stop offset="1" stop-color="#18324d"/>
    </linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b9487"/>
      <stop offset="1" stop-color="#187a9f"/>
    </linearGradient>
    <style>
      .accent-dot { animation: breathe 3.4s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .accent-dot { animation: none; } }
    </style>
  </defs>
  <rect width="390" height="844" fill="#f3f6fa"/>
  <path d="M0 0H390V257Q390 278 369 278H21Q0 278 0 257Z" fill="url(#brand-bg)"/>
  <circle cx="345" cy="72" r="118" fill="#38d7c2" opacity=".08"/>
  <circle cx="345" cy="72" r="75" fill="none" stroke="#77dbd1" stroke-opacity=".16"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="22" y="24" width="42" height="42" rx="13" fill="url(#action)"/>
    <path d="M32 36Q42 33 53 39V53Q42 48 32 52Z" fill="none" stroke="#f1ffff" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M42 37V51" stroke="#f1ffff" stroke-width="1.3"/>
    <text x="76" y="43" fill="#f7fbff" font-size="15" font-weight="750">PrathamOne</text>
    <text x="76" y="59" fill="#a8bfd5" font-size="9" letter-spacing="1.4">EDUOS</text>

    <text x="24" y="96" fill="#9de9df" font-size="9" font-weight="700" letter-spacing="1.5">COACHING INSTITUTE EDITION</text>
    <text x="24" y="140" fill="#f5f9ff" font-size="25" font-weight="750" letter-spacing="-.5">One connected home</text>
    <text x="24" y="171" fill="#f5f9ff" font-size="25" font-weight="750" letter-spacing="-.5">for every learner.</text>
    <text x="25" y="201" fill="#b6c8da" font-size="12">A thoughtful workspace for your institute.</text>
    <circle class="accent-dot" cx="30" cy="229" r="3.5" fill="#55dfc8"/>
    <text x="41" y="233" fill="#c6d7e6" font-size="10">Academic operations · Teaching · Student success</text>

    <text x="26" y="323" fill="#167d77" font-size="10" font-weight="700" letter-spacing="1.2">ACCOUNT ACCESS</text>
    <text x="24" y="365" fill="#16253a" font-size="29" font-weight="750" letter-spacing="-.6">Welcome back</text>
    <text x="25" y="390" fill="#69788b" font-size="13">Sign in to your academy workspace.</text>

    <text x="26" y="434" fill="#26374c" font-size="12" font-weight="650">Email or username</text>
    <rect x="24" y="447" width="342" height="52" rx="11" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"/>
    <text x="42" y="479" fill="#8996a7" font-size="13">Enter your email or username</text>

    <text x="26" y="535" fill="#26374c" font-size="12" font-weight="650">Password</text>
    <rect x="24" y="548" width="342" height="52" rx="11" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"/>
    <text x="42" y="580" fill="#7e8b9b" font-size="16" letter-spacing="3">••••••••••••</text>
    <g transform="translate(331 565)" fill="none" stroke="#8794a5" stroke-width="1.4">
      <path d="M0 8Q8-1 16 8Q8 17 0 8Z"/>
      <circle cx="8" cy="8" r="2.7"/>
    </g>

    <rect x="25" y="623" width="17" height="17" rx="4" fill="#ffffff" stroke="#aab7c6" stroke-width="1.3"/>
    <text x="51" y="636" fill="#57677b" font-size="11">Remember this device</text>
    <text x="365" y="636" text-anchor="end" fill="#087f82" font-size="11" font-weight="650">Forgot password?</text>

    <rect x="24" y="666" width="342" height="54" rx="12" fill="url(#action)"/>
    <text x="195" y="699" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Sign in securely</text>
    <path d="M333 686H347M341 680L347 686L341 692" fill="none" stroke="#e7fffb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="195" y="757" text-anchor="middle" fill="#66768a" font-size="11">Need access? Contact your institute administrator.</text>
    <text x="195" y="794" text-anchor="middle" fill="#92a0b0" font-size="10">Privacy · Help · Secure account access</text>
    <text x="195" y="824" text-anchor="middle" fill="#9aa5b2" font-size="9">© 2026 AITDL · PrathamOne EduOS</text>
  </g>
</svg>
