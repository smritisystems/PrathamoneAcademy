<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07111f">
    <title>PrathamOne EduOS — Responsive Login Mockup</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        overflow-x: hidden;
        background: #07111f;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 1440px;
        margin: 0 auto;
      }
      picture, img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <picture>
        <source media="(max-width: 760px)" srcset="animated-boards-subjects-mobile.svg">
        <img src="animated-boards-subjects.svg" alt="PrathamOne EduOS login mockup with boards, subjects, fee totals, paid and outstanding amounts, and admissions charts">
      </picture>
    </main>
  </body>
</html>
