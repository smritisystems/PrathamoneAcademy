<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prashant Academy – Coaching Institute Management System</title>
    <!-- PWA & Mobile Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PrathamOne" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="Enterprise Coaching Institute and Academic Management System for Prashant Academy" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Pre-hydration Instant Brand Theme Resolver (Zero Flicker & Tenant-Isolated) -->
    <script>
      (function() {
        try {
          var authRaw = localStorage.getItem('prashant-auth');
          var instId = 1;
          if (authRaw) {
            try {
              var auth = JSON.parse(authRaw);
              if (auth && auth.state && auth.state.selectedInstitutionId) {
                instId = auth.state.selectedInstitutionId;
              }
            } catch(e) {}
          }
          var raw = localStorage.getItem('pratham_branding_inst_' + instId) || localStorage.getItem('pratham_active_branding');
          if (raw) {
            var b = JSON.parse(raw);
            if (b && b.colors && b.colors.primary) {
              var root = document.documentElement;
              var p = b.colors.primary;
              var s = b.colors.secondary || p;
              var a = b.colors.accent || s || p;
              root.style.setProperty('--brand-primary', p);
              root.style.setProperty('--brand-secondary', s);
              root.style.setProperty('--brand-accent', a);
              root.style.setProperty('--color-primary', p);
              root.style.setProperty('--color-secondary', s);
              root.style.setProperty('--color-accent', a);
              root.style.setProperty('--brand-gradient', 'linear-gradient(135deg, ' + p + ' 0%, ' + s + ' 100%)');
              var meta = document.querySelector('meta[name="theme-color"]');
              if (meta) meta.setAttribute('content', p);
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
