services:
  db:
    image: postgres:16-alpine
    container_name: prashant_academy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-prashant_academy}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-prashant_academy}"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4_base
    container_name: prashant_academy_clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prashant_academy_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-prashant_academy}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting backend}
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:80","http://localhost:3000","http://localhost"]'
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      LICENSE_AUTHORITY_URL: ${LICENSE_AUTHORITY_URL:-}
      LICENSE_PRODUCT_CODE: ${LICENSE_PRODUCT_CODE:-prathamone-eduos}
      LICENSE_PUBLIC_KEYS_JSON: ${LICENSE_PUBLIC_KEYS_JSON:-}
      LICENSE_ENFORCEMENT_STAGE: ${LICENSE_ENFORCEMENT_STAGE:-shadow}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_SECONDS: 60
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backups:/app/backups
      - ./data/backups:/app/data/backups
      - homework_uploads:/app/uploads
    working_dir: /app
    command: >
      sh -c "cd /app &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prashant_academy_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
  homework_uploads:
  clamav_db:
